# ==============================================================================
# CẤU HÌNH VIRTUAL HOST CHO SERVER 1 (domain1.local)
# Phục vụ Web 1 và Reverse Proxy API đến Node-RED kèm CORS
# ==============================================================================
server {
    listen 80;
    server_name domain1.local www.domain1.local localhost;

    # Thư mục chứa mã nguồn Web 1
    root /usr/share/nginx/html/web1;
    index index.html index.htm;

    # Cấu hình log riêng cho Virtual Host 1
    access_log /var/log/nginx/web1_access.log;
    error_log  /var/log/nginx/web1_error.log;

    # Phục vụ trang tĩnh giao diện Web 1
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy: Chuyển tiếp toàn bộ request /api/ sang Node-RED container
    location /api/ {
        # Đẩy request sang container nodered cổng 1880
        proxy_pass http://nodered:1880/api/;

        # Header chuẩn của Reverse Proxy
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CẤU HÌNH CORS (Cross-Origin Resource Sharing) ĐẦY ĐỦ
        # 1. Xử lý preflight OPTIONS request
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # 2. Header CORS cho các request GET, POST, ... thông thường
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }

    # Trang báo lỗi 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ==============================================================================
# CẤU HÌNH VIRTUAL HOST CHO SERVER 2 (domain2.local)
# Phục vụ Web 2 (Landing Page chứng minh đa tên miền)
# ==============================================================================
server {
    listen 80;
    server_name domain2.local www.domain2.local;

    # Thư mục chứa mã nguồn Web 2
    root /usr/share/nginx/html/web2;
    index index.html index.htm;

    # Cấu hình log riêng cho Virtual Host 2
    access_log /var/log/nginx/web2_access.log;
    error_log  /var/log/nginx/web2_error.log;

    # Phục vụ Landing Page Web 2
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Trang báo lỗi 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
