services:
  # 1. Dịch vụ Nginx Reverse Proxy & Static Web Server
  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Lấy từ file .env; nginx:alpine tự thay vào nginx/templates/*.template
      # Mặc định *.localhost: trình duyệt tự trỏ về 127.0.0.1, không cần sửa file hosts
      DOMAIN1: ${DOMAIN1:-web1.localhost}
      DOMAIN2: ${DOMAIN2:-web2.localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./web1:/usr/share/nginx/html/web1:ro
      - ./web2:/usr/share/nginx/html/web2:ro
    depends_on:
      - nodered
    networks:
      - web-net

  # 2. Dịch vụ Node-RED (API backend & Workflow)
  nodered:
    image: nodered/node-red:latest
    container_name: nodered_app
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    networks:
      - web-net

  # 3. Dịch vụ Cơ sở dữ liệu MariaDB
  mariadb:
    image: mariadb:11.4
    container_name: mariadb_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: web_db
      MYSQL_USER: web_user
      MYSQL_PASSWORD: web_password_123
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - web-net

  # 4. Dịch vụ phpMyAdmin Quản trị Database
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_ui
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password_123
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    networks:
      - web-net

  # 5. Cloudflare Tunnel đưa web ra Internet
  # ---------------------------------------------------------------------------
  # MẶC ĐỊNH (không cần domain, không cần tài khoản Cloudflare): "Quick Tunnel".
  # Mỗi container nhận 1 địa chỉ ngẫu nhiên https://xxxx.trycloudflare.com.
  # --http-host-header gắn Host = DOMAIN1/DOMAIN2 nên nginx vẫn chọn đúng website.
  # Xem địa chỉ:  docker compose logs cloudflared cloudflared-web2 | grep trycloudflare
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_web1
    restart: unless-stopped
    command: "tunnel --no-autoupdate --url http://nginx:80 --http-host-header ${DOMAIN1:-web1.localhost}"
    depends_on:
      - nginx
    networks:
      - web-net

  cloudflared-web2:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_web2
    restart: unless-stopped
    command: "tunnel --no-autoupdate --url http://nginx:80 --http-host-header ${DOMAIN2:-web2.localhost}"
    depends_on:
      - nginx
    networks:
      - web-net

  # KHI CÓ DOMAIN THẬT: điền CLOUDFLARE_TUNNEL_TOKEN + DOMAIN1/DOMAIN2 trong .env rồi chạy
  #   docker compose --profile domain-that up -d
  # Trên Cloudflare: Public Hostname DOMAIN1 và DOMAIN2 đều trỏ tới http://nginx:80
  cloudflared-named:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_named
    restart: unless-stopped
    profiles: ["domain-that"]
    command: "tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-chua_dien_token}"
    depends_on:
      - nginx
    networks:
      - web-net

# Quản lý Volume dữ liệu bền vững (Persistent Data)
volumes:
  mariadb_data:
    driver: local
  nodered_data:
    driver: local

# Bridge Network chung cho phép các container phân giải hostname của nhau
networks:
  web-net:
    driver: bridge
